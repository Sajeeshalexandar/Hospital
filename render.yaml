services:
  - type: web
    name: hospital-management-saas
    runtime: python
    plan: free
    buildCommand: bash website/build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-management-db
          property: connectionString

databases:
  - name: hospital-management-db
    plan: free
    databaseName: hospital_management
    user: hospital_management
