services:
  - type: web
    name: hospital-management-saas
    runtime: python
    region: ohio
    plan: free
    buildCommand: bash website/build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
